# ─────────────────────────────────────────────────────────────
#  RL Experiments — shared configuration
# ─────────────────────────────────────────────────────────────

environment:
  name: "CartPole-v1"
  max_steps: 500
  solved_threshold: 195
  eval_episodes: 50

training:
  episodes: 500
  discount: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.999 # per-episode decay
  epsilon_decay_per_step: 0.999942 # per-step decay (~10 steps/ep)5       # good for CartPole (500 episodes)
  seed: 42

# Q-Learning specific
qlearning:
  learning_rate: 0.1
  bins: 12

# DQN specific
dqn:
  learning_rate: 0.001
  batch_size: 64
  replay_capacity: 10000
  hidden_size: 64
  target_update: 10

# PPO specific
ppo:
  learning_rate: 0.0003
  hidden_size: 64
  epochs: 4
  batch_size: 64
  update_every: 256
  clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  gae_lambda: 0.95

# System
system:
  device: "auto" # "auto" | "cpu" | "mps" | "cuda"

# ─────────────────────────────────────────────────────────────
#  FrozenLake — tuned separately from CartPole
#  Each problem has very different learning dynamics:
#    CartPole: dense reward, long episodes, 500 enough
#    FrozenLake: sparse reward, short episodes, needs 10000+
# ─────────────────────────────────────────────────────────────
frozenlake:
  size: 6
  is_slippery: false
  domain_randomisation: true
  episodes: 10000

  # Epsilon tuned for FrozenLake episode count
  # 0.999^10000 = 0.000045 → nearly zero by end
  epsilon_decay: 0.999 # per-episode decay
  epsilon_decay_per_step: 0.999942 # per-step decay (~10 steps/ep)

  # Curriculum — now reachable with better tuning
  curriculum: true
  curriculum_thresholds:
    - [0.5, 6] # lowered: 0.5 avg → 6x6  (was 0.6, too hard)
    - [0.65, 8] # lowered: 0.65 avg → 8x8  (was 0.7)

  # DQN overrides for FrozenLake
  # smaller buffer → less stale experience polluting updates
  dqn_replay_capacity: 2000
  dqn_target_update: 50 # sync less often — episodes are very short

  # PPO overrides for FrozenLake
  # smaller batch → more frequent updates on short episodes
  ppo_update_every: 64 # was 256 — now ~5-10 episodes per update

  # Reward shaping
  reward_shaping: true
  reward_goal: 1.0
  reward_hole: -0.3 # softened: was -0.5, too harsh early on
  reward_step: -0.005 # softened: was -0.01
  reward_closer: 0.02 # reduced: was 0.05, was dominating goal signal

# Plotting
plot:
  smoothing_window: 100
  save_dir: "results"
  show: true

# ─────────────────────────────────────────────────────────────
#  MARL — Independent PPO (IPPO) on cooperative FrozenLake
# ─────────────────────────────────────────────────────────────
marl:
  total_timesteps: 500000 # total env steps across both agents
  n_envs: 4 # parallel envs for faster collection
  learning_rate: 0.0003
  n_steps: 256 # steps collected before each update
  batch_size: 64
  n_epochs: 4 # PPO update passes per batch
  clip_range: 0.2
  ent_coef: 0.01 # entropy bonus — keeps agents exploring
