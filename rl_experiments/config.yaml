# ─────────────────────────────────────────────────────────────
#  RL Experiments — shared configuration
#  All agents read from this file via utils.load_config()
#  Change values here to affect every experiment at once.
# ─────────────────────────────────────────────────────────────
system:
  device: "auto" # "auto" | "cpu" | "mps" | "cuda"

environment:
  name: "CartPole-v1"
  max_steps: 500 # gymnasium default cap per episode
  solved_threshold: 195 # avg reward over eval_episodes to call "solved"
  eval_episodes: 20 # how many episodes to run during evaluation

training:
  episodes: 5000 # total training episodes
  discount: 0.99 # γ — future reward discount factor
  epsilon_start: 1.0 # start fully exploring
  epsilon_end: 0.01 # minimum exploration floor
  epsilon_decay: 0.995 # multiply epsilon by this each episode
  seed: 42 # for reproducibility

# Q-Learning specific
qlearning:
  learning_rate: 0.001
  bins: 12 # buckets per continuous state dimension

# DQN specific
dqn:
  learning_rate: 0.001 # Adam LR (smaller than Q-table — network is sensitive)
  batch_size: 64 # mini-batch size for replay sampling
  replay_capacity: 10000 # max transitions in replay buffer
  hidden_size: 64 # neurons per hidden layer
  target_update: 10 # sync target network every N episodes

# PPO specific
ppo:
  learning_rate: 0.001 # lower than DQN — policy gradient is sensitive
  hidden_size: 64
  epochs: 4 # how many passes over each collected batch
  batch_size: 64 # mini-batch size within each epoch
  update_every: 256 # collect this many steps before each update
  clip_epsilon: 0.2 # max policy change per update (the "proximal" part)
  value_coef: 0.5 # critic loss weight in combined loss
  entropy_coef: 0.01 # entropy bonus — keeps policy from collapsing
  gae_lambda: 0.95 # GAE smoothing (0=TD, 1=Monte Carlo)

# FrozenLake specific
frozenlake:
  size: 4 # grid size (4x4, 6x6, 8x8)
  is_slippery: false # slippery ice — actions succeed only 1/3 of the time
  domain_randomisation: true # regenerate map every episode
  episodes: 5000 # FrozenLake needs many more episodes than CartPole
  curriculum: true # grow map size as agent improves
  curriculum_thresholds:
    - [0.6, 6] # if last-100 avg > 0.6 → switch to 6x6
    - [0.7, 8] # if last-100 avg > 0.7 → switch to 8x8

  # Reward shaping — critical for sparse-reward environments
  # Without shaping, agent only sees +1 at goal — almost no learning signal
  reward_shaping: true
  reward_goal: 1.0 # reaching goal (keep original)
  reward_hole: -0.5 # penalty for falling in a hole
  reward_step: -0.01 # small step penalty → encourages shorter paths
  reward_closer: 0.05 # bonus for moving closer to goal (Manhattan distance)

# Plotting
plot:
  smoothing_window: 20 # moving average window for reward curves
  save_dir: "results" # where to save .png files
  show: true # display plot interactively (set false for headless)
